# Cấu hình Nginx Reverse Proxy (Non-Root / Unprivileged)
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cấu hình đường dẫn tạm cho non-root user (nginx)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Ẩn phiên bản máy chủ Nginx
    server_tokens off;

    # Định dạng log chi tiết phục vụ Promtail / Loki
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log /dev/stdout custom;
    error_log  /dev/stderr warn;

    # Giới hạn kích thước tải lên (tối đa 3MB cho tệp 2MB)
    client_max_body_size 3m;

    # Tối ưu hóa gửi tệp và nén Gzip
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cấu hình SSL tối ưu hóa
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!CAMELLIA:!RC4:!SHA1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # WebSocket Upgrade Mapping cho Grafana Live
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Cấu hình Rate Limiting: Chỉ áp dụng khi request method là POST tại trang đăng nhập
    map $request_method $login_limit_key {
        POST $binary_remote_addr;
        default "";
    }

    # Định nghĩa vùng rate limit (5r/m, burst=5, trả về HTTP 429 khi vượt ngưỡng)
    limit_req_zone $login_limit_key zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # 1. CỔNG HTTP (8080 trong container) -> REDIRECT 301 SANG HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        # Chuyển hướng toàn bộ sang HTTPS cổng 443
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # 2. CỔNG HTTPS CHÍNH (8443 trong container)
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Security Headers (always)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

        # Đường dẫn đăng nhập có bảo vệ chống Brute-force bằng Rate Limiting
        location = /auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Ứng dụng Web CRM chính
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Quản trị pgAdmin dưới đường dẫn con /pgadmin/
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;
        }

        # Quản trị giám sát Grafana dưới đường dẫn con /grafana/ (Hỗ trợ WebSocket Live)
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # --------------------------------------------------------------------------
    # 3. MÁY CHỦ NỘI BỘ NGINX METRICS (8081) - KHÔNG PUBLISH RA NGOÀI
    # Phục vụ riêng cho nginx-exporter ở Bước 4
    # --------------------------------------------------------------------------
    server {
        listen 8081;
        server_name 127.0.0.1;

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
